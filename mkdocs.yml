site_name: DataConsistencyChecker
site_description: Interpretable data-quality checks, pattern discovery and outlier detection for tabular data.
site_url: https://diogoribeiro7.github.io/DataConsistencyChecker/
repo_url: https://github.com/DiogoRibeiro7/DataConsistencyChecker
repo_name: DiogoRibeiro7/DataConsistencyChecker
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Diogo Ribeiro &mdash; MIT License

theme:
  name: material
  features:
    - content.code.copy
    - content.action.edit
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

exclude_docs: |
  _hooks/

hooks:
  - docs/_hooks/checks_catalog.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              returns_named_value: false
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - User guide:
      - How it works: guide/how-it-works.md
      - Running checks: guide/running-checks.md
      - Reviewing results: guide/reviewing-results.md
      - Outlier scores: guide/outlier-scores.md
      - Curating results: guide/curating-results.md
      - Configuration and one-shot analysis: guide/configuration.md
      - Command line: guide/cli.md
      - Structured reports: guide/reports.md
      - Synthetic data and demos: guide/synthetic-data.md
      - Performance: guide/performance.md
  - Checks catalog: checks.md
  - API reference:
      - DataConsistencyChecker: reference/checker.md
      - analyze, configuration and reports: reference/analysis.md
  - Examples: examples.md
  - Development:
      - Contributing: development/contributing.md
      - Testing: development/testing.md
      - Architecture: development/architecture.md
