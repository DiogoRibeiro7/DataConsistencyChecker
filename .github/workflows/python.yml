name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Ruff Correctness Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-poetry@v1
        with:
          python-version: '3.10'
          install-deps: 'false'
      - name: Validate dependency lock
        run: poetry check --lock
      - name: Install dependencies
        run: |
          poetry install --no-interaction
      - name: Run Ruff on the package (full rule set)
        run: poetry run ruff check src --output-format=github
      - name: Run Ruff correctness checks on the tests
        run: |
          poetry run ruff check tests \
            --select E9,F63,F7,F82 \
            --output-format=github

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-poetry@v1
        with:
          python-version: '3.10'
          install-deps: 'false'
      - name: Install dependencies
        run: |
          poetry install --no-interaction
      - name: Run mypy
        run: |
          poetry run mypy . --show-error-codes || true
        continue-on-error: true

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-poetry@v1
        with:
          python-version: ${{ matrix.python-version }}
          install-deps: 'false'
      - name: Install dependencies
        run: |
          poetry install --no-interaction
      - name: Run tests with coverage
        run: |
          poetry run pytest --cov=data_consistency_checker --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.10'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  package:
    name: Package Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DiogoRibeiro7/git-actions-collection/.github/actions/setup-poetry@v1
        with:
          python-version: '3.12'
          install-deps: 'false'
      - name: Validate dependency lock
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Build wheel and source distribution
        run: poetry build
      - name: Smoke-test package imports
        run: |
          poetry run python -c "from data_consistency_checker import DataConsistencyChecker; assert DataConsistencyChecker.__name__ == 'DataConsistencyChecker'"
          poetry run python -c "from check_data_consistency import DataConsistencyChecker; assert DataConsistencyChecker.__name__ == 'DataConsistencyChecker'"
      - name: Smoke-test CLI entry point
        run: |
          poetry run data-consistency-checker --help
          poetry run python -m data_consistency_checker --help
