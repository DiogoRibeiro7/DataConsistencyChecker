[tool.poetry]
name = "data-consistency-checker"
version = "0.1.0"
description = "Toolkit for analyzing dataset consistency"
authors = ["Diogo Ribeiro <dfr@esmad.ipp.pt>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/DiogoRibeiro7/DataConsistencyChecker"
repository = "https://github.com/DiogoRibeiro7/DataConsistencyChecker"
keywords = ["data-quality", "eda", "outlier-detection", "data-validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
packages = [
    { include = "data_consistency_checker", from = "src" },
    { include = "check_data_consistency", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
DataExcept = ">=1.6,<2.0"
pandas = "*"
numpy = "*"
scikit-learn = "*"
matplotlib = "*"
seaborn = "*"
ipython = "*"
python-dateutil = "*"
termcolor = "*"
scipy = "*"
dill = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
ruff = "*"
mypy = "*"
pre-commit = "*"
bandit = {extras = ["toml"], version = "*"}

[tool.poetry.scripts]
data-consistency-checker = "data_consistency_checker.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"

# Exclude common directories.
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "Demo Notebooks",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "W", "I", "N", "UP", "YTT", "ASYNC", "B", "A", "C4", "T10", "ISC", "ICN", "PIE", "PYI", "RSE", "RET", "SIM", "TID", "ARG", "PLE", "PLW"]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults
    "B905",  # zip() without an explicit strict= parameter
    "N803",  # Argument name should be lowercase
    "N806",  # Variable in function should be lowercase
    "N802",  # Function name should be lowercase (for test methods)
    "PLW2901", # Redefined loop variable
    "W191",  # Tab indentation (this codebase uses tabs, keeping for now)
    "E101",  # Mixed spaces and tabs (keeping for now)
]

# Allow fix for all enabled rules (when `--fix` is provided).
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true incrementally
disallow_incomplete_defs = false  # Set to true incrementally
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "scipy.*",
    "matplotlib.*",
    "seaborn.*",
    "termcolor.*",
    "dateutil.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
]

[tool.coverage.run]
source = ["data_consistency_checker"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    ".venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101", "B601"]  # B101: assert_used, B601: paramiko_calls
